org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The module is big (every block's Compose code): the Kotlin compiler needs more than the 3 GB it
# inherits from org.gradle.jvmargs, and runs out of heap ("GC overhead limit exceeded") otherwise.
kotlin.daemon.jvmargs=-Xmx6g
